<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AIOps Analyse-Chat</title>
<style>
  :root {
    --bg: #111217; --panel: #181b1f; --border: #2c3235; --text: #d8d9da;
    --muted: #8e9297; --accent: #3874e8; --user-bubble: #2b3a55; --bot-bubble: #22262b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; height: 100vh; display: flex; background: var(--bg); color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 14px;
  }
  #chat-col { flex: 1 1 60%; display: flex; flex-direction: column; min-width: 0; }
  #ctx-col {
    flex: 0 0 340px; border-left: 1px solid var(--border); background: var(--panel);
    display: flex; flex-direction: column; overflow: hidden;
  }
  header {
    padding: 14px 20px; border-bottom: 1px solid var(--border); background: var(--panel);
  }
  header h1 { font-size: 16px; margin: 0 0 2px; }
  header p { margin: 0; color: var(--muted); font-size: 12px; }
  #messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
  .msg { max-width: 80%; padding: 10px 14px; border-radius: 10px; line-height: 1.45; white-space: pre-wrap; }
  .msg.user { align-self: flex-end; background: var(--user-bubble); }
  .msg.bot { align-self: flex-start; background: var(--bot-bubble); }
  .msg.pending { color: var(--muted); font-style: italic; }
  #input-row { display: flex; gap: 8px; padding: 14px 20px; border-top: 1px solid var(--border); }
  #input-row input {
    flex: 1; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border);
    background: #0f1114; color: var(--text); font-size: 14px;
  }
  #input-row button {
    padding: 10px 18px; border-radius: 8px; border: none; background: var(--accent);
    color: white; font-weight: 600; cursor: pointer;
  }
  #input-row button:disabled { opacity: .5; cursor: default; }
  #ctx-col h2 { font-size: 13px; padding: 14px 16px 8px; margin: 0; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  #ctx-body { flex: 1; overflow-y: auto; padding: 0 16px 16px; white-space: pre-wrap; font-family: ui-monospace, monospace; font-size: 12px; color: #a8adb3; }
  .examples { padding: 0 20px 10px; display: flex; gap: 8px; flex-wrap: wrap; }
  .examples button {
    background: none; border: 1px solid var(--border); color: var(--muted); border-radius: 999px;
    padding: 6px 12px; font-size: 12px; cursor: pointer;
  }
  .examples button:hover { border-color: var(--accent); color: var(--text); }
</style>
</head>
<body>
  <div id="chat-col">
    <header>
      <h1>AIOps Analyse-Chat</h1>
      <p>Cloud-Sprachmodell (Groq) - liest Alarme, Metriken und Topologie live mit.</p>
    </header>
    <div class="examples">
      <button data-q="Warum ist checkout gerade langsam?">Warum ist checkout gerade langsam?</button>
      <button data-q="Gibt es aktuell Auffaelligkeiten in der Filiale?">Auffaelligkeiten in der Filiale?</button>
      <button data-q="Fasse den aktuellen Zustand des Systems zusammen.">Systemzustand zusammenfassen</button>
    </div>
    <div id="messages"></div>
    <div id="input-row">
      <input id="input" type="text" placeholder="Frage stellen..." autocomplete="off">
      <button id="send">Senden</button>
    </div>
  </div>
  <div id="ctx-col">
    <h2>Verwendeter Kontext</h2>
    <div id="ctx-body">Wird bei der ersten Frage geladen.</div>
  </div>

<script>
const messagesEl = document.getElementById('messages');
const inputEl = document.getElementById('input');
const sendEl = document.getElementById('send');
const ctxEl = document.getElementById('ctx-body');
let history = [];

function addMessage(role, text) {
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  div.textContent = text;
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return div;
}

async function send(message) {
  if (!message.trim()) return;
  inputEl.value = '';
  sendEl.disabled = true;
  addMessage('user', message);
  const pending = addMessage('bot pending', 'Denkt nach...');

  try {
    const res = await fetch('/chat', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({message, history}),
    });
    const data = await res.json();
    pending.remove();
    addMessage('bot', data.reply);
    ctxEl.textContent = data.context || '(kein Kontext)';
    history.push({role: 'user', content: message});
    history.push({role: 'assistant', content: data.reply});
  } catch (err) {
    pending.remove();
    addMessage('bot', 'Fehler beim Abrufen der Antwort: ' + err);
  } finally {
    sendEl.disabled = false;
    inputEl.focus();
  }
}

sendEl.addEventListener('click', () => send(inputEl.value));
inputEl.addEventListener('keydown', (e) => { if (e.key === 'Enter') send(inputEl.value); });
document.querySelectorAll('.examples button').forEach(btn => {
  btn.addEventListener('click', () => send(btn.dataset.q));
});
</script>
</body>
</html>
