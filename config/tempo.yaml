server:
  http_listen_port: 3200

# Grafanas Tempo-Backend oeffnet einen gRPC-Kanal gegen die Datasource-URL (tempo:3200).
# Ohne diese Option antwortet dort nur HTTP/1.1 -> "http2: frame too large".
stream_over_http_enabled: true

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

# Leitet aus den Traces automatisch RED-Metriken und einen Service-Graph ab
# und schreibt sie nach VictoriaMetrics - Basis fuer die Service-Map im Dashboard.
metrics_generator:
  registry:
    external_labels:
      source: tempo
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://victoriametrics:8428/api/v1/write
        send_exemplars: true
  processor:
    span_metrics:
      dimensions:
        - http.method
        - http.route
        - http.status_code
    service_graphs:
      dimensions:
        - http.method

overrides:
  defaults:
    metrics_generator:
      processors:
        - service-graphs
        - span-metrics
