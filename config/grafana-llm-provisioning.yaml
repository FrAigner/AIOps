apiVersion: 1
apps:
  - type: grafana-llm-app
    org_id: 1
    disabled: false
    jsonData:
      openAI:
        provider: custom
        url: https://api.groq.com/openai/v1
        # Modellname, der bei "Explain this panel" o.ae. verwendet wird.
        # Muss in Grafana zusaetzlich einmalig unter Administration ->
        # Plugins and data -> Plugins -> LLM -> Configuration nachgetragen
        # werden - das Feld laesst sich aus der Provisioning-Datei allein
        # nicht vollstaendig setzen.
        organizationId: ""
    secureJsonData:
      # $GROQ_API_KEY wird durch GF_ENABLE_ENVIRONMENT_VARIABLE_EXPANSION=true
      # (siehe docker-compose.yml) zur Laufzeit aus der Umgebungsvariable
      # ersetzt - der eigentliche Key steht nirgends im Repo.
      openAIKey: "$GROQ_API_KEY"
